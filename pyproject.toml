[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# プロジェクト固有の情報（ここだけ書き換えればOK）
name = "tray-translate"
version = "0.1.0"
description = "Python tooling for tray-translate (verification only)"
requires-python = ">=3.10"

# 必須のパッケージ
dependencies = [
    # 例: "requests>=2.31.0",
    # 例: "pydantic>=2.0.0"
]

[project.optional-dependencies]
# Issue #4 の基準値計測用(検証専用。コア本体は依存しない)
bench = [
    "argostranslate==1.11.0",
    # argostranslate -> stanza -> torch の依存で NVIDIA(CUDA)モジュールが入るのを避けるため、
    # torch を直接依存に置き、下記 [tool.uv.sources] で CPU 版の索引に向ける
    "torch"
]
# 開発・テスト環境専用のパッケージ（共通デファクトスタンダード）
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0"
]

# 検証用途のみ。プロジェクト自体はビルド・インストールしない（依存のみ uv で管理）
[tool.uv]
package = false

# CPU 専用の PyTorch 索引（NVIDIA モジュールを含まない）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ==========================================
# Linter & Formatter (Ruff)
# ==========================================
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "alembic",
    "etc",
    "old",
    "venv",
    ".venv",
    "tests" # Exclude tests folder from linting for now, as it might have specific test patterns
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, W: pycodestyle warnings, I: isort
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/tool/__init__.py" = ["F401"]
"run.py" = ["E402"]
"tool/model_manager_gui.py" = ["E402"]

[tool.ruff.lint.isort]
# 自分のプロジェクトのパッケージ名を指定（自動ソート時にローカルパッケージとして認識させるため）
known-first-party = ["app"]
force-sort-within-sections = true

# ==========================================
# Type Checker (Mypy)
# ==========================================
[tool.mypy]
python_version = "3.10"
# 基本的に厳しめの設定（Strict）にしておくのがモダンな手法
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
# サードパーティ製ライブラリの型定義が見つからない際のエラーを抑制
ignore_missing_imports = true
# 元の mypy.ini ではカンマ区切りの単一文字列だったが、mypy の exclude は正規表現のため
# 意図通りに機能させるには配列（各要素が正規表現）に変換するのが正しい書き方
exclude = [
    "build/",
    "venv/",
    "\\.venv/",
    "alembic/",
    "etc/",
    "old/"
]

[[tool.mypy.overrides]]
module = "app.tool.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.db.db_session_manager"
ignore_errors = true

# ==========================================
# Testing (Pytest)
# ==========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"