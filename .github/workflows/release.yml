name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_name: tt
            asset_name: tt-linux-x86_64.tar.gz
          - os: windows-latest
            bin_name: tt.exe
            asset_name: tt-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --bin tt

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd target/release
          tar -czf "../../${{ matrix.asset_name }}" "${{ matrix.bin_name }}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/release
          7z a "../../${{ matrix.asset_name }}" "${{ matrix.bin_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true

      - name: Upload Artifact (workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
