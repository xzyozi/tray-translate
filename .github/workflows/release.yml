name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: tray-translate-linux-x86_64.tar.gz
          - os: windows-latest
            asset_name: tray-translate-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --bin tt

      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release -p tray-translate-cli -p tray-translate-gui

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/tt staging/
          cp README.md LICENSE staging/
          tar -czf "${{ matrix.asset_name }}" -C staging .

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/tt.exe staging/
          cp target/release/tt-gui.exe staging/
          cp README.md LICENSE staging/
          7z a "${{ matrix.asset_name }}" ./staging/*

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true

      - name: Upload Artifact (workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
