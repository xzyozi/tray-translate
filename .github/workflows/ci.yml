name: CI

# Rust のビルド・検証に影響するファイルが変わったときだけ実行する
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/ci.sh'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/ci.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows は時間がかかるため PR ではスキップ（Ubuntu で即時判定）。
        # main push 時や手動実行時にフル検証する。
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # sccache は Ubuntu のみ使用する（CMake の C/C++ ビルドも対象）
      - name: Run sccache-action
        if: runner.os == 'Linux'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Enable sccache
        if: runner.os == 'Linux'
        shell: bash
        run: |
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "RUSTC_WRAPPER=sccache"
            echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          } >> "$GITHUB_ENV"

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      # Projects opt in to their language-specific checks through one of these contracts.
      - name: Detect project CI contract
        id: detect
        shell: bash
        run: |
          if [ -f ".github/ci.sh" ]; then
            echo "runner=script" >> "$GITHUB_OUTPUT"
          elif [ -f "Makefile" ] && grep -Eq '^ci[[:space:]]*:' Makefile; then
            echo "runner=make" >> "$GITHUB_OUTPUT"
          else
            echo "runner=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Run project CI script
        if: steps.detect.outputs.runner == 'script'
        shell: bash
        run: bash .github/ci.sh

      # GUI クレートは default-members 外のため ci.sh の clippy/test の対象にならない。
      # Ubuntu では GUI の依存をビルドしない方針なので、Windows でのみ検証する（fmt は --all で対象）。
      - name: GUI checks (clippy / test)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo clippy -p tray-translate-gui --all-targets --locked -- -D warnings
          cargo test -p tray-translate-gui --locked

      - name: Run Makefile CI target
        if: steps.detect.outputs.runner == 'make'
        shell: bash
        run: make ci

      - name: Skip project-specific checks
        if: steps.detect.outputs.runner == 'none'
        shell: bash
        run: |
          echo "No project CI contract found; project-specific checks are skipped."
          echo "Add .github/ci.sh or a Makefile target named ci to enable checks."

      - name: Print sccache statistics
        if: always() && runner.os == 'Linux'
        shell: bash
        run: sccache --show-stats
